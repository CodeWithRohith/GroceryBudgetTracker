<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grocery Bill Scanner & Budget Tracker</title>
  <!-- Tailwind CSS via CDN for modern styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tesseract.js for in-browser OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-8">
  <div class="max-w-xl mx-auto space-y-6">

    <!-- Header -->
    <header class="text-center">
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">🧾 Grocery Budget Tracker</h1>
      <p class="text-sm text-slate-500">Scan receipts and track your monthly spending</p>
    </header>

    <!-- Budget Overview Card -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <span class="text-xs uppercase font-semibold text-slate-400">Current Month</span>
          <h2 id="currentMonthLabel" class="text-lg font-bold text-slate-800">Month Year</h2>
        </div>
        <div class="text-right">
          <label class="text-xs uppercase font-semibold text-slate-400 block">Monthly Limit</label>
          <div class="flex items-center space-x-1">
            <span>$</span>
            <input type="number" id="budgetLimitInput" class="w-24 text-right font-bold text-slate-800 border-b border-slate-300 focus:outline-none focus:border-indigo-500" value="500" />
          </div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div>
        <div class="flex justify-between text-sm font-medium mb-1">
          <span>Spent: <strong id="totalSpentText" class="text-slate-900">$0.00</strong></span>
          <span>Remaining: <strong id="remainingText" class="text-emerald-600">$500.00</strong></span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Scanner / Input Section -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h3 class="font-semibold text-slate-800">Add Receipt</h3>
      
      <!-- Upload / Camera Button -->
      <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 hover:border-indigo-500 bg-slate-50 hover:bg-indigo-50/30 rounded-xl p-6 cursor-pointer transition">
        <svg class="w-8 h-8 text-slate-400 mb-2" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" />
        </svg>
        <span class="text-sm font-medium text-slate-700">Take Photo or Upload Receipt</span>
        <span class="text-xs text-slate-400 mt-1">Supports JPG, PNG</span>
        <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden" />
      </label>

      <!-- OCR Status Indicator -->
      <div id="ocrStatus" class="hidden text-xs text-center font-medium text-indigo-600 animate-pulse">
        Scanning receipt... <span id="ocrProgress">0%</span>
      </div>

      <!-- Extracted / Manual Form -->
      <form id="receiptForm" class="space-y-3 pt-2">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold text-slate-500">Store / Title</label>
            <input type="text" id="storeInput" placeholder="e.g. Costco, Walmart" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" required />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Amount ($)</label>
            <input type="number" step="0.01" id="amountInput" placeholder="0.00" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" required />
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500">Date</label>
          <input type="date" id="dateInput" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" required />
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition text-sm">
          + Add to Budget
        </button>
      </form>
    </div>

    <!-- Expense History -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-semibold text-slate-800">This Month's Receipts</h3>
        <button id="clearAllBtn" class="text-xs text-red-500 hover:underline">Clear Month</button>
      </div>
      <ul id="receiptList" class="divide-y divide-slate-100 text-sm">
        <!-- Rendered items go here -->
      </ul>
    </div>

  </div>

  <script>
    // --- State & Helpers ---
    const now = new Date();
    const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    
    document.getElementById('currentMonthLabel').textContent = now.toLocaleDateString('default', { month: 'long', year: 'numeric' });
    document.getElementById('dateInput').valueAsDate = now;

    let budget = parseFloat(localStorage.getItem(`budget_${currentMonthKey}`)) || 500;
    let receipts = JSON.parse(localStorage.getItem(`receipts_${currentMonthKey}`)) || [];

    document.getElementById('budgetLimitInput').value = budget;

    // --- Core Functions ---
    function saveAndRender() {
      localStorage.setItem(`receipts_${currentMonthKey}`, JSON.stringify(receipts));
      localStorage.setItem(`budget_${currentMonthKey}`, budget);

      const totalSpent = receipts.reduce((sum, item) => sum + item.amount, 0);
      const remaining = budget - totalSpent;
      const percentage = Math.min((totalSpent / (budget || 1)) * 100, 100);

      document.getElementById('totalSpentText').textContent = `$${totalSpent.toFixed(2)}`;
      
      const remainingEl = document.getElementById('remainingText');
      remainingEl.textContent = `$${remaining.toFixed(2)}`;
      remainingEl.className = remaining < 0 ? "text-red-500 font-bold" : "text-emerald-600 font-bold";

      const bar = document.getElementById('progressBar');
      bar.style.width = `${percentage}%`;
      bar.className = remaining < 0 
        ? "bg-red-500 h-3 rounded-full transition-all duration-300" 
        : "bg-indigo-600 h-3 rounded-full transition-all duration-300";

      // Render List
      const list = document.getElementById('receiptList');
      list.innerHTML = receipts.length === 0 ? '<li class="text-xs text-slate-400 py-3 text-center">No receipts added yet.</li>' : '';

      receipts.slice().reverse().forEach((item, index) => {
        const actualIndex = receipts.length - 1 - index;
        const li = document.createElement('li');
        li.className = "py-2.5 flex justify-between items-center";
        li.innerHTML = `
          <div>
            <div class="font-medium text-slate-800">${item.store}</div>
            <div class="text-xs text-slate-400">${item.date}</div>
          </div>
          <div class="flex items-center space-x-3">
            <span class="font-semibold text-slate-900">$${item.amount.toFixed(2)}</span>
            <button onclick="deleteReceipt(${actualIndex})" class="text-slate-300 hover:text-red-500">&times;</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    window.deleteReceipt = function(idx) {
      receipts.splice(idx, 1);
      saveAndRender();
    };

    // --- OCR Logic ---
    document.getElementById('imageInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const ocrStatus = document.getElementById('ocrStatus');
      const ocrProgress = document.getElementById('ocrProgress');
      ocrStatus.classList.remove('hidden');

      try {
        const worker = await Tesseract.createWorker('eng');
        
        // Track progress
        const res = await worker.recognize(file);
        const text = res.data.text;
        await worker.terminate();

        parseReceiptText(text);
      } catch (err) {
        console.error(err);
        alert('OCR failed to read the image. Please enter manually.');
      } finally {
        ocrStatus.classList.add('hidden');
      }
    });

    // Simple heuristic parser for Total & Date
    function parseReceiptText(text) {
      console.log("Raw OCR:", text);
      const lines = text.split('\n');
      
      let detectedAmount = null;
      let detectedDate = null;
      let detectedStore = lines.find(l => l.trim().length > 3) || "Grocery Store";

      // 1. Look for currency lines with "TOTAL", "AMOUNT DUE", "BALANCE"
      const totalRegex = /(?:total|amount|balance|due)[\D]*([\d]+[.,]\d{2})/i;
      for (const line of lines) {
        const match = line.match(totalRegex);
        if (match) {
          detectedAmount = parseFloat(match[1].replace(',', '.'));
          break;
        }
      }

      // Fallback: search for largest price on the receipt if keyword wasn't found
      if (!detectedAmount) {
        const allAmounts = text.match(/\b\d+\.\d{2}\b/g);
        if (allAmounts) {
          detectedAmount = Math.max(...allAmounts.map(v => parseFloat(v)));
        }
      }

      // 2. Look for date: MM/DD/YYYY or YYYY-MM-DD
      const dateRegex = /\b(\d{1,2}[/-]\d{1,2}[/-]\d{2,4})\b/;
      const dateMatch = text.match(dateRegex);
      if (dateMatch) {
        const parsed = new Date(dateMatch[1]);
        if (!isNaN(parsed.getTime())) {
          detectedDate = parsed.toISOString().split('T')[0];
        }
      }

      // Fill in form for the user to review/adjust
      if (detectedAmount) document.getElementById('amountInput').value = detectedAmount;
      if (detectedDate) document.getElementById('dateInput').value = detectedDate;
      document.getElementById('storeInput').value = detectedStore.replace(/[^a-zA-Z0-9 ]/g, '').slice(0, 25);
    }

    // --- Form Submissions ---
    document.getElementById('receiptForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const store = document.getElementById('storeInput').value;
      const amount = parseFloat(document.getElementById('amountInput').value);
      const date = document.getElementById('dateInput').value;

      if (!amount || amount <= 0) return;

      receipts.push({ store, amount, date });
      saveAndRender();

      // Reset fields
      document.getElementById('storeInput').value = '';
      document.getElementById('amountInput').value = '';
      document.getElementById('imageInput').value = '';
    });

    document.getElementById('budgetLimitInput').addEventListener('change', (e) => {
      budget = parseFloat(e.target.value) || 0;
      saveAndRender();
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      if (confirm("Clear all receipts for this month?")) {
        receipts = [];
        saveAndRender();
      }
    });

    // Initial load
    saveAndRender();
  </script>
</body>
</html>
