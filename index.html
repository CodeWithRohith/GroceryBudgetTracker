<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grocery Budget Tracker Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- Phosphor Icons for crisp modern UI icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100/70 text-slate-900 min-h-screen antialiased selection:bg-brand-500 selection:text-white">

  <!-- Main Container -->
  <div class="max-w-2xl mx-auto px-4 py-6 sm:py-10 space-y-6">

    <!-- Top Navigation & Data Management -->
    <header class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white text-xl shadow-lg shadow-brand-500/30">
          <i class="ph-bold ph-receipt"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-slate-900">GroceryFlow</h1>
          <p class="text-xs text-slate-500">Local & Private Budgeting</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="exportToCSV()" title="Export CSV" class="p-2 text-slate-600 hover:text-brand-600 hover:bg-white rounded-lg border border-slate-200 transition">
          <i class="ph-bold ph-download-simple text-base"></i>
        </button>
      </div>
    </header>

    <!-- Month Selector Bar -->
    <div class="bg-white p-2 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
      <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-xl text-slate-600 transition">
        <i class="ph-bold ph-caret-left text-lg"></i>
      </button>

      <div class="flex items-center space-x-2">
        <span id="activeMonthDisplay" class="font-bold text-sm tracking-wide text-slate-800">Month YYYY</span>
        <button id="todayBtn" onclick="jumpToCurrentMonth()" class="hidden text-[10px] uppercase font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full hover:bg-brand-50 hover:text-brand-600 transition">
          Current
        </button>
      </div>

      <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-xl text-slate-600 transition">
        <i class="ph-bold ph-caret-right text-lg"></i>
      </button>
    </div>

    <!-- Budget Dashboard Overview -->
    <section class="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-sm space-y-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-5">
        <div>
          <span class="text-xs font-semibold uppercase text-slate-400 tracking-wider">Total Spent</span>
          <div class="text-3xl font-extrabold tracking-tight text-slate-900 mt-0.5" id="totalSpentText">$0.00</div>
        </div>

        <div class="bg-slate-50 rounded-2xl p-2.5 px-4 border border-slate-200/60 flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
          <span class="text-xs font-medium text-slate-500">Monthly Target:</span>
          <div class="flex items-center font-bold text-slate-800">
            <span class="text-slate-400 mr-1">$</span>
            <input type="number" id="budgetLimitInput" class="w-20 bg-transparent font-bold focus:outline-none focus:ring-1 focus:ring-brand-500 rounded px-1 text-right" />
          </div>
        </div>
      </div>

      <!-- Progress Meter -->
      <div class="space-y-2">
        <div class="flex justify-between items-center text-xs font-medium text-slate-600">
          <span>Remaining: <strong id="remainingBudgetText" class="text-emerald-600 font-bold">$0.00</strong></span>
          <span id="budgetPercentageText">0% used</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden p-0.5">
          <div id="progressBar" class="bg-brand-600 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <!-- KPI Pills: Safe-to-Spend & Receipt Count -->
      <div class="grid grid-cols-2 gap-3 pt-1">
        <div class="bg-slate-50 border border-slate-200/60 rounded-2xl p-3">
          <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Daily Safe Spend</span>
          <span id="dailyBurnText" class="text-base font-bold text-slate-700 mt-0.5 block">$0.00 / day</span>
        </div>
        <div class="bg-slate-50 border border-slate-200/60 rounded-2xl p-3">
          <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Receipts Logged</span>
          <span id="receiptCountText" class="text-base font-bold text-slate-700 mt-0.5 block">0 trips</span>
        </div>
      </div>
    </section>

    <!-- Scan Receipt Trigger & Quick Add -->
    <section>
      <label class="group relative flex items-center justify-between p-4 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white rounded-2xl shadow-md shadow-brand-500/20 cursor-pointer transition active:scale-[0.99]">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-xl">
            <i class="ph-bold ph-camera"></i>
          </div>
          <div>
            <h4 class="font-semibold text-sm">Scan Grocery Receipt</h4>
            <p class="text-xs text-indigo-100">Extracts total & auto-categorizes</p>
          </div>
        </div>
        <span class="text-xs font-semibold bg-white/20 px-3 py-1.5 rounded-xl group-hover:bg-white/30 transition">Upload</span>
        <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden" />
      </label>

      <!-- Processing State Card -->
      <div id="scanningStatus" class="hidden mt-3 bg-white border border-brand-200 rounded-2xl p-4 shadow-sm flex items-center space-x-3 animate-pulse">
        <div class="w-8 h-8 rounded-full border-2 border-brand-600 border-t-transparent animate-spin"></div>
        <div>
          <p class="text-xs font-bold text-brand-700">Reading receipt with on-device AI...</p>
          <p id="scanningProgress" class="text-[11px] text-slate-400">Initializing OCR model...</p>
        </div>
      </div>
    </section>

    <!-- Receipts History List -->
    <section class="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-sm space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-sm text-slate-800">Monthly History</h3>
        <button onclick="openManualAddModal()" class="text-xs font-semibold text-brand-600 hover:text-brand-700 flex items-center space-x-1">
          <i class="ph-bold ph-plus"></i>
          <span>Manual Entry</span>
        </button>
      </div>

      <ul id="receiptList" class="divide-y divide-slate-100 text-sm">
        <!-- Rendered items go here -->
      </ul>
    </section>

  </div>

  <!-- Review / Verification Modal -->
  <div id="reviewModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="font-bold text-base text-slate-800">Verify Receipt Data</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg">
          <i class="ph-bold ph-x"></i>
        </button>
      </div>

      <!-- Scanned Preview Thumbnail -->
      <div id="receiptImageThumbnailContainer" class="hidden flex items-center space-x-3 p-2 bg-slate-50 border border-slate-200 rounded-xl">
        <img id="receiptImageThumbnail" class="w-12 h-12 object-cover rounded-lg border border-slate-200" alt="Scanned Receipt" />
        <span class="text-xs text-slate-500">Image analyzed on-device</span>
      </div>

      <form id="receiptForm" class="space-y-3.5">
        <div>
          <label class="text-xs font-semibold text-slate-500 block mb-1">Store Name</label>
          <input type="text" id="modalStore" class="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none" placeholder="e.g. Trader Joe's, Costco" required />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold text-slate-500 block mb-1">Total Amount ($)</label>
            <input type="number" step="0.01" id="modalAmount" class="w-full text-sm font-bold border border-slate-200 rounded-xl p-2.5 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none text-slate-900" placeholder="0.00" required />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 block mb-1">Date</label>
            <input type="date" id="modalDate" class="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none text-slate-600" required />
          </div>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-500 block mb-1">Category</label>
          <select id="modalCategory" class="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none bg-white">
            <option value="Groceries">🛒 Groceries / General</option>
            <option value="Produce">🥦 Fresh Produce / Fruits</option>
            <option value="Meat & Dairy">🥩 Meat & Dairy</option>
            <option value="Snacks & Drinks">🥤 Snacks & Drinks</option>
            <option value="Household">🧼 Household / Toiletries</option>
          </select>
        </div>

        <div class="pt-3 flex space-x-2">
          <button type="button" onclick="closeModal()" class="w-1/2 py-2.5 text-sm font-semibold rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition">Discard</button>
          <button type="submit" class="w-1/2 py-2.5 text-sm font-semibold rounded-xl bg-brand-600 hover:bg-brand-700 text-white shadow-md shadow-brand-500/20 transition">Save to Budget</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Client Application Logic -->
  <script>
    // --- State Variables ---
    const actualToday = new Date();
    let viewedDate = new Date(); // Tracks the currently browsed month
    
    // Category style mapping
    const CATEGORY_COLORS = {
      'Groceries': 'bg-slate-100 text-slate-700',
      'Produce': 'bg-emerald-50 text-emerald-700',
      'Meat & Dairy': 'bg-amber-50 text-amber-700',
      'Snacks & Drinks': 'bg-purple-50 text-purple-700',
      'Household': 'bg-sky-50 text-sky-700'
    };

    function getMonthKey(dateObj) {
      return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
    }

    function getDaysInMonth(year, monthIndex) {
      return new Date(year, monthIndex + 1, 0).getDate();
    }

    // --- Smart Budget Retrieval (Rollover Logic) ---
    function getBudgetForMonth(monthKey) {
      const explicit = localStorage.getItem(`budget_${monthKey}`);
      if (explicit !== null) return parseFloat(explicit);

      // Rollover: If this month has no budget set, find the most recently set budget
      const keys = Object.keys(localStorage).filter(k => k.startsWith('budget_')).sort().reverse();
      for (const k of keys) {
        if (k < `budget_${monthKey}`) {
          const inherited = parseFloat(localStorage.getItem(k));
          if (!isNaN(inherited)) return inherited;
        }
      }
      return 500; // Fallback default
    }

    // --- Render App View ---
    function render() {
      const currentKey = getMonthKey(viewedDate);
      const isViewingCurrentMonth = currentKey === getMonthKey(actualToday);

      // Month Title
      document.getElementById('activeMonthDisplay').textContent = viewedDate.toLocaleDateString('default', { month: 'long', year: 'numeric' });
      document.getElementById('todayBtn').classList.toggle('hidden', isViewingCurrentMonth);

      // Load Data
      const budget = getBudgetForMonth(currentKey);
      const receipts = JSON.parse(localStorage.getItem(`receipts_${currentKey}`)) || [];

      document.getElementById('budgetLimitInput').value = budget;

      // Stats
      const totalSpent = receipts.reduce((sum, r) => sum + r.amount, 0);
      const remaining = budget - totalSpent;
      const pct = Math.min((totalSpent / (budget || 1)) * 100, 100);

      document.getElementById('totalSpentText').textContent = `$${totalSpent.toFixed(2)}`;
      document.getElementById('receiptCountText').textContent = `${receipts.length} trip${receipts.length === 1 ? '' : 's'}`;

      const remainingEl = document.getElementById('remainingBudgetText');
      remainingEl.textContent = `$${remaining.toFixed(2)}`;
      remainingEl.className = remaining < 0 ? 'text-red-500 font-bold' : 'text-emerald-600 font-bold';

      document.getElementById('budgetPercentageText').textContent = `${Math.round(pct)}% of target`;

      const bar = document.getElementById('progressBar');
      bar.style.width = `${pct}%`;
      bar.className = remaining < 0 ? 'bg-red-500 h-2 rounded-full transition-all duration-300' : 'bg-brand-600 h-2 rounded-full transition-all duration-300';

      // Daily Safe-to-Spend Calculation
      const dailyBurnEl = document.getElementById('dailyBurnText');
      if (isViewingCurrentMonth) {
        const daysInMonth = getDaysInMonth(viewedDate.getFullYear(), viewedDate.getMonth());
        const daysLeft = Math.max(daysInMonth - actualToday.getDate() + 1, 1);
        const safeDaily = remaining > 0 ? (remaining / daysLeft).toFixed(2) : '0.00';
        dailyBurnEl.textContent = `$${safeDaily} / day`;
      } else {
        dailyBurnEl.textContent = viewedDate < actualToday ? 'Month Closed' : 'Upcoming';
      }

      // Receipts List
      const listEl = document.getElementById('receiptList');
      listEl.innerHTML = '';

      if (receipts.length === 0) {
        listEl.innerHTML = `
          <li class="py-8 text-center text-slate-400">
            <i class="ph-bold ph-receipt text-3xl mb-1 block"></i>
            <span class="text-xs">No receipts registered for this month.</span>
          </li>`;
      } else {
        receipts.slice().reverse().forEach((r, idx) => {
          const actualIndex = receipts.length - 1 - idx;
          const li = document.createElement('li');
          li.className = 'py-3.5 flex justify-between items-center group';
          li.innerHTML = `
            <div class="flex items-center space-x-3">
              <div class="w-9 h-9 rounded-xl flex items-center justify-center text-sm font-bold ${CATEGORY_COLORS[r.category] || 'bg-slate-100 text-slate-700'}">
                ${r.store.charAt(0).toUpperCase()}
              </div>
              <div>
                <div class="font-semibold text-slate-800 text-sm">${r.store}</div>
                <div class="flex items-center space-x-2 text-[11px] text-slate-400">
                  <span>${r.date}</span>
                  <span>•</span>
                  <span class="font-medium">${r.category || 'Groceries'}</span>
                </div>
              </div>
            </div>
            <div class="flex items-center space-x-3">
              <span class="font-bold text-slate-900">$${r.amount.toFixed(2)}</span>
              <button onclick="deleteReceipt(${actualIndex})" class="opacity-0 group-hover:opacity-100 p-1 text-slate-300 hover:text-red-500 rounded transition" title="Delete">
                <i class="ph-bold ph-trash"></i>
              </button>
            </div>
          `;
          listEl.appendChild(li);
        });
      }
    }

    // --- Navigation ---
    function changeMonth(offset) {
      viewedDate.setMonth(viewedDate.getMonth() + offset);
      render();
    }

    function jumpToCurrentMonth() {
      viewedDate = new Date();
      render();
    }

    // --- Budget Persistence ---
    document.getElementById('budgetLimitInput').addEventListener('change', (e) => {
      const currentKey = getMonthKey(viewedDate);
      const val = parseFloat(e.target.value) || 0;
      localStorage.setItem(`budget_${currentKey}`, val);
      render();
    });

    // --- Receipt Deletion ---
    window.deleteReceipt = function(idx) {
      const currentKey = getMonthKey(viewedDate);
      const receipts = JSON.parse(localStorage.getItem(`receipts_${currentKey}`)) || [];
      receipts.splice(idx, 1);
      localStorage.setItem(`receipts_${currentKey}`, JSON.stringify(receipts));
      render();
    };

    // --- OCR Scanning Workflow ---
    document.getElementById('imageInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const scanStatus = document.getElementById('scanningStatus');
      const scanProgress = document.getElementById('scanningProgress');
      scanStatus.classList.remove('hidden');

      // Create thumbnail preview
      const thumbUrl = URL.createObjectURL(file);
      document.getElementById('receiptImageThumbnail').src = thumbUrl;
      document.getElementById('receiptImageThumbnailContainer').classList.remove('hidden');

      try {
        const worker = await Tesseract.createWorker('eng');
        scanProgress.textContent = "Analyzing characters...";
        
        const res = await worker.recognize(file);
        const text = res.data.text;
        await worker.terminate();

        parseAndOpenModal(text);
      } catch (err) {
        console.error(err);
        alert('OCR could not read the image. You can still input manually.');
        openManualAddModal();
      } finally {
        scanStatus.classList.add('hidden');
        e.target.value = '';
      }
    });

    // --- Regex Extraction Engine ---
    function parseAndOpenModal(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

      let detectedAmount = null;
      let detectedDate = new Date().toISOString().split('T')[0];
      let detectedStore = lines.length > 0 ? lines[0].replace(/[^a-zA-Z0-9\s]/g, '').slice(0, 25) : "Grocery Store";

      // 1. Search for keyword Total
      const totalRegex = /(?:total|balance|amount due|visa|mastercard|debit)[\D]*([\d]+[.,]\d{2})/i;
      for (const line of lines) {
        const match = line.match(totalRegex);
        if (match) {
          detectedAmount = parseFloat(match[1].replace(',', '.'));
          break;
        }
      }

      // 2. Fallback to largest currency match
      if (!detectedAmount) {
        const amounts = text.match(/\b\d+\.\d{2}\b/g);
        if (amounts) {
          detectedAmount = Math.max(...amounts.map(v => parseFloat(v)));
        }
      }

      // 3. Search Date
      const dateRegex = /\b(\d{1,2}[/-]\d{1,2}[/-]\d{2,4})\b/;
      const dateMatch = text.match(dateRegex);
      if (dateMatch) {
        const parsed = new Date(dateMatch[1]);
        if (!isNaN(parsed.getTime())) {
          detectedDate = parsed.toISOString().split('T')[0];
        }
      }

      // Populate review modal
      document.getElementById('modalStore').value = detectedStore;
      document.getElementById('modalAmount').value = detectedAmount || '';
      document.getElementById('modalDate').value = detectedDate;
      document.getElementById('reviewModal').classList.remove('hidden');
    }

    function openManualAddModal() {
      document.getElementById('receiptImageThumbnailContainer').classList.add('hidden');
      document.getElementById('modalStore').value = '';
      document.getElementById('modalAmount').value = '';
      document.getElementById('modalDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('reviewModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('reviewModal').classList.add('hidden');
    }

    // --- Form Save ---
    document.getElementById('receiptForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const store = document.getElementById('modalStore').value;
      const amount = parseFloat(document.getElementById('modalAmount').value);
      const date = document.getElementById('modalDate').value;
      const category = document.getElementById('modalCategory').value;

      if (!amount || amount <= 0) return;

      // Ensure receipt is filed under the month matching its receipt date
      const targetMonthKey = date.slice(0, 7); // e.g. "2026-11"
      const receipts = JSON.parse(localStorage.getItem(`receipts_${targetMonthKey}`)) || [];

      receipts.push({
        id: Date.now(),
        store,
        amount,
        date,
        category
      });

      localStorage.setItem(`receipts_${targetMonthKey}`, JSON.stringify(receipts));

      // Jump view to the month of the receipt added
      viewedDate = new Date(date + 'T00:00:00');
      closeModal();
      render();
    });

    // --- CSV Export (Privacy-Friendly Backup) ---
    function exportToCSV() {
      const currentKey = getMonthKey(viewedDate);
      const receipts = JSON.parse(localStorage.getItem(`receipts_${currentKey}`)) || [];

      if (receipts.length === 0) {
        alert("No receipts to export for this month.");
        return;
      }

      let csv = "Date,Store,Category,Amount\n";
      receipts.forEach(r => {
        csv += `"${r.date}","${r.store}","${r.category}",${r.amount.toFixed(2)}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', `groceries_${currentKey}.csv`);
      a.click();
    }

    // Initialize application
    render();
  </script>
</body>
</html>
